plugins {
    id 'com.android.application'
}

android {
    namespace 'dns.changer.deepcode'
    compileSdk 34

    defaultConfig {
        applicationId "dns.changer.deepcode"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "4.0"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            def ks = file("deepcode.jks")
            if (ks.exists()) {
                storeFile ks
                storePassword "deep121212A"
                keyAlias "deepiran"
                keyPassword "deep121212A"
            }
        }
    }

    buildTypes {
        release {
            if (file("deepcode.jks").exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        dataBinding true
        viewBinding true
        compose false
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:-options'
}

afterEvaluate {
    tasks.matching { it.name.toLowerCase().contains('jdkimage') }.configureEach {
        enabled = false
    }
}

dependencies {
    implementation 'dnsjava:dnsjava:3.5.2'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.databinding:databinding-runtime:8.0.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
