# DC DNS Changer — Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=false

android.useAndroidX=true
android.enableJetifier=true
android.jetifier.ignorelist=kotlin-stdlib,kotlin-stdlib-jdk7,kotlin-stdlib-jdk8
android.nonTransitiveRClass=true
android.nonFinalResIds=false
android.defaults.buildfeatures.buildconfig=true
android.suppressUnsupportedCompileSdk=34

# Fixes AndroidIDE / Code on the Go JDK 21 jlink crash:
# Failed to transform core-for-system-modules.jar (jlink --disable-plugin system-modules)
android.experimental.enableJdkImageTransform=false

kotlin.code.style=official
kotlin.incremental=false
kotlin.incremental.java=false
