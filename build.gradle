plugins {
    id 'com.android.application' version '8.7.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}

// AndroidIDE / Termux OpenJDK 21: jlink dies on --disable-plugin system-modules.
// Disable any leftover JdkImage tasks if a plugin still registers them.
subprojects {
    afterEvaluate { project ->
        project.tasks.matching { it.name.toLowerCase().contains("jdkimage") }.configureEach {
            enabled = false
        }
    }
}
